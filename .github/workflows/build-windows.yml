name: Build Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (example: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Electron project
        run: |
          set -e
          mkdir -p winapp/app winapp/build
          cd winapp
          cat > package.json <<'EOF_PACKAGE_JSON'
          {
            "name": "smart-invoice-maker",
            "productName": "Smart Invoice Maker",
            "version": "${{ inputs.version }}",
            "description": "Smart Invoice Maker",
            "main": "main.js",
            "author": "baserr4-bit",
            "license": "UNLICENSED",
            "devDependencies": {
              "electron": "33.2.1",
              "electron-builder": "25.1.8"
            },
            "dependencies": {
              "html2canvas": "1.4.1",
              "vazirmatn": "latest"
            },
            "build": {
              "appId": "io.github.baserr4bit.invoice",
              "productName": "Smart Invoice Maker",
              "files": ["main.js", "preload.js", "lib.js", "app/**/*", "package.json"],
              "directories": { "buildResources": "build", "output": "dist" },
              "artifactName": "SmartInvoiceMaker-Setup-${version}-${arch}.${ext}",
              "win": { "target": "nsis", "icon": "build/icon.png" },
              "nsis": {
                "oneClick": false,
                "perMachine": false,
                "allowToChangeInstallationDirectory": true,
                "createDesktopShortcut": true,
                "createStartMenuShortcut": true,
                "deleteAppDataOnUninstall": false
              }
            }
          }
          EOF_PACKAGE_JSON
          cat > main.js <<'EOF_MAIN_JS'
          const { app, BrowserWindow, ipcMain, shell, Menu } = require('electron');
          const path = require('path');
          const lib = require('./lib');
          
          if (!app.requestSingleInstanceLock()) {
            app.quit();
          }
          
          let win = null;
          
          function create() {
            Menu.setApplicationMenu(null);
            win = new BrowserWindow({
              width: 520,
              height: 900,
              minWidth: 360,
              minHeight: 560,
              backgroundColor: '#eef0e4',
              title: 'Smart Invoice Maker',
              autoHideMenuBar: true,
              webPreferences: {
                preload: path.join(__dirname, 'preload.js'),
                contextIsolation: true,
                nodeIntegration: false,
                sandbox: false
              }
            });
            win.loadFile(path.join(__dirname, 'app', 'index.html'));
            win.webContents.setWindowOpenHandler(({ url }) => {
              if (/^https?:|^mailto:|^tel:/i.test(url)) shell.openExternal(url);
              return { action: 'deny' };
            });
            win.webContents.on('will-navigate', (e, url) => {
              if (!url.startsWith('file:')) {
                e.preventDefault();
                if (/^https?:/i.test(url)) shell.openExternal(url);
              }
            });
          }
          
          app.on('second-instance', () => {
            if (win) {
              if (win.isMinimized()) win.restore();
              win.focus();
            }
          });
          app.whenReady().then(create);
          app.on('window-all-closed', () => app.quit());
          
          function roots() {
            const r = [];
            for (const k of ['downloads', 'documents', 'desktop']) {
              try { r.push(app.getPath(k)); } catch (e) {}
            }
            try { r.push(path.join(app.getPath('home'), 'Downloads')); } catch (e) {}
            return Array.from(new Set(r));
          }
          
          ipcMain.on('save-file', (e, b64, name) => {
            try {
              lib.writeUnique(app.getPath('downloads'), name, b64);
              e.returnValue = true;
            } catch (err) { e.returnValue = false; }
          });
          
          ipcMain.on('share-file', (e, b64, name) => {
            try {
              const p = lib.writeUnique(app.getPath('downloads'), name, b64);
              shell.showItemInFolder(p);
              e.returnValue = true;
            } catch (err) { e.returnValue = false; }
          });
          
          ipcMain.on('list-backups', (e) => {
            try { e.returnValue = lib.listBackups(roots()); } catch (err) { e.returnValue = '[]'; }
          });
          
          ipcMain.on('read-file', (e, p) => {
            e.returnValue = lib.readBackup(p);
          });
          EOF_MAIN_JS
          cat > preload.js <<'EOF_PRELOAD_JS'
          const { contextBridge, ipcRenderer } = require('electron');
          
          contextBridge.exposeInMainWorld('NativeApp', {
            shareFile: (b64, name, mime, text) => ipcRenderer.sendSync('share-file', b64, name),
            saveFile: (b64, name, mime) => ipcRenderer.sendSync('save-file', b64, name),
            saveImage: (b64, name) => ipcRenderer.sendSync('save-file', b64, name),
            hasAllFilesAccess: () => true,
            requestAllFilesAccess: () => {},
            listBackups: () => ipcRenderer.sendSync('list-backups'),
            readFile: (p) => ipcRenderer.sendSync('read-file', String(p))
          });
          EOF_PRELOAD_JS
          cat > lib.js <<'EOF_LIB_JS'
          const fs = require('fs');
          const path = require('path');
          const MAXB = 20000000;
          
          function safeName(n) {
            return String(n || 'file').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 150) || 'file';
          }
          
          function uniquePath(dir, name) {
            let p = path.join(dir, name), i = 1;
            const ext = path.extname(name), base = path.basename(name, ext);
            while (fs.existsSync(p)) {
              p = path.join(dir, base + ' (' + (i++) + ')' + ext);
            }
            return p;
          }
          
          function scan(dir, depth, out, skip) {
            if (depth > 5 || out.length > 300) return;
            let list;
            try { list = fs.readdirSync(dir, { withFileTypes: true }); } catch (e) { return; }
            for (const d of list) {
              const n = d.name, full = path.join(dir, n);
              if (d.isDirectory()) {
                if (n[0] === '.' || skip.has(n.toLowerCase())) continue;
                scan(full, depth + 1, out, skip);
              } else if (n.toLowerCase().endsWith('.backup')) {
                try {
                  const st = fs.statSync(full);
                  if (st.size > 0 && st.size < MAXB) out.push({ path: full, name: n, t: st.mtimeMs });
                } catch (e) {}
              }
            }
          }
          
          function listBackups(roots) {
            const out = [], seen = new Set();
            const skip = new Set(['appdata', 'node_modules', 'windows', 'program files', 'program files (x86)', '$recycle.bin', 'system volume information']);
            for (const r of roots) scan(r, 0, out, skip);
            const u = [];
            for (const x of out) { if (!seen.has(x.path)) { seen.add(x.path); u.push(x); } }
            u.sort((a, b) => b.t - a.t);
            return JSON.stringify(u.slice(0, 15).map(x => ({ path: x.path, name: x.name })));
          }
          
          function readBackup(p) {
            try {
              if (!/\.backup$/i.test(String(p))) return '';
              const st = fs.statSync(p);
              if (!st.isFile() || st.size > MAXB) return '';
              return fs.readFileSync(p, 'utf8');
            } catch (e) { return ''; }
          }
          
          function writeUnique(dir, name, b64) {
            fs.mkdirSync(dir, { recursive: true });
            const p = uniquePath(dir, safeName(name));
            fs.writeFileSync(p, Buffer.from(String(b64), 'base64'));
            return p;
          }
          
          module.exports = { safeName, uniquePath, scan, listBackups, readBackup, writeUnique };
          EOF_LIB_JS
          cat > prepare.js <<'EOF_PREPARE_JS'
          // Makes the app fully offline: local html2canvas + local Vazirmatn font instead of CDN links.
          const fs = require('fs');
          const path = require('path');
          const appDir = path.join(__dirname, 'app');
          const htmlPath = path.join(appDir, 'index.html');
          let html = fs.readFileSync(htmlPath, 'utf8');
          
          function walk(dir, out) {
            let list = [];
            try { list = fs.readdirSync(dir, { withFileTypes: true }); } catch (e) { return out; }
            for (const d of list) {
              const f = path.join(dir, d.name);
              if (d.isDirectory()) walk(f, out); else out.push(f);
            }
            return out;
          }
          
          // 1) html2canvas (needed for invoice images)
          const h2c = path.join(__dirname, 'node_modules', 'html2canvas', 'dist', 'html2canvas.min.js');
          if (fs.existsSync(h2c)) {
            fs.copyFileSync(h2c, path.join(appDir, 'html2canvas.min.js'));
            html = html.replace(/<script[^>]*html2canvas[^>]*><\/script>/i, '<script src="html2canvas.min.js"></script>');
            console.log('html2canvas: local copy used');
          } else {
            console.log('WARNING: html2canvas not found, CDN link kept');
          }
          
          // 2) Vazirmatn font
          const files = walk(path.join(__dirname, 'node_modules', 'vazirmatn'), []);
          const want = { 400: 'Vazirmatn-Regular.woff2', 600: 'Vazirmatn-SemiBold.woff2', 800: 'Vazirmatn-ExtraBold.woff2' };
          let css = '';
          fs.mkdirSync(path.join(appDir, 'fonts'), { recursive: true });
          for (const w of Object.keys(want)) {
            const hit = files.find(f => path.basename(f) === want[w]);
            if (hit) {
              fs.copyFileSync(hit, path.join(appDir, 'fonts', want[w]));
              css += '@font-face{font-family:Vazirmatn;font-weight:' + w + ';font-style:normal;src:url("fonts/' + want[w] + '") format("woff2")}\n';
            }
          }
          html = html.replace(/<link[^>]*fonts\.(googleapis|gstatic)\.com[^>]*>/gi, '');
          if (css) {
            html = html.replace('</head>', '<style>' + css + '</style></head>');
            console.log('Vazirmatn: local font used');
          } else {
            console.log('WARNING: Vazirmatn files not found, system fonts will be used');
          }
          fs.writeFileSync(htmlPath, html);
          EOF_PREPARE_JS
          cp ../index.html app/index.html
          cp ../icon-512.png build/icon.png

      - name: Install dependencies
        run: |
          cd winapp
          npm install --no-audit --no-fund

      - name: Make app offline
        run: |
          cd winapp
          node prepare.js

      - name: Build installers (32-bit and 64-bit)
        run: |
          cd winapp
          npx electron-builder --win --x64 --publish never
          npx electron-builder --win --ia32 --publish never
          ls -la dist

      - name: Save installers as downloadable files in this run
        uses: actions/upload-artifact@v4
        with:
          name: smart-invoice-maker-windows
          path: winapp/dist/*.exe

      - name: Publish installers in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-v${{ inputs.version }}
          name: Smart Invoice Maker Windows ${{ inputs.version }}
          files: winapp/dist/*.exe
