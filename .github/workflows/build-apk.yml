name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (example: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android project
        run: |
          set -e
          sudo apt-get install -y imagemagick >/dev/null
          SITE_URL="https://baserr4-bit.github.io/smart-invoice-maker/"
          mkdir -p android/app/src/main/res/values
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name="${d%%:*}"; size="${d##*:}"
            mkdir -p "android/app/src/main/res/mipmap-$name"
            convert icon-512.png -resize "${size}x${size}" "android/app/src/main/res/mipmap-$name/ic_launcher.png"
          done
          cat > android/settings.gradle <<'GRADLE'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'SmartInvoiceMaker'
          include ':app'
          GRADLE
          cat > android/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          GRADLE
          cat > android/gradle.properties <<'GRADLE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          GRADLE
          cat > android/app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'io.github.baserr4bit.invoice'
              compileSdk 34
              defaultConfig {
                  applicationId 'io.github.baserr4bit.invoice'
                  minSdk 21
                  targetSdk 34
                  versionCode Integer.parseInt(String.valueOf(project.findProperty('appVersionCode') ?: '1'))
                  versionName String.valueOf(project.findProperty('appVersionName') ?: '1.0.0')
              }
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'invoice2026'
                      keyAlias 'key0'
                      keyPassword 'invoice2026'
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
          }
          dependencies {
              implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
          }
          GRADLE
          cat > android/app/src/main/res/values/strings.xml <<'XML'
          <resources>
              <string name="app_name">فاکتور ساز هوشمند</string>
          </resources>
          XML
          cat > android/app/src/main/res/values/colors.xml <<'XML'
          <resources>
              <color name="colorPrimary">#4d6b3a</color>
          </resources>
          XML
          cat > android/app/src/main/AndroidManifest.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar">
                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true">
                      <meta-data android:name="android.support.customtabs.trusted.DEFAULT_URL" android:value="$SITE_URL" />
                      <meta-data android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR" android:resource="@color/colorPrimary" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          keytool -genkeypair -keystore android/app/release.keystore -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -storepass invoice2026 -keypass invoice2026 -dname "CN=Smart Invoice Maker, O=baserr4-bit, C=IR"

      - name: Build APK
        run: gradle -p android assembleRelease -PappVersionName=${{ inputs.version }} -PappVersionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk smart-invoice-maker.apk

      - name: Save APK as downloadable file in this run
        uses: actions/upload-artifact@v4
        with:
          name: smart-invoice-maker-apk
          path: smart-invoice-maker.apk

      - name: Publish APK in Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Smart Invoice Maker ${{ inputs.version }}
          files: smart-invoice-maker.apk
