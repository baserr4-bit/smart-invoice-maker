<script>
const VER='1.7.0';
const DGS={fa:'۰۱۲۳۴۵۶۷۸۹',ur:'۰۱۲۳۴۵۶۷۸۹',ar:'٠١٢٣٤٥٦٧٨٩'};
const LG=()=>(S&&S.lang)||'fa';
const F=n=>String(n).replace(/\d/g,d=>(DGS[LG()]||'0123456789')[d]);
const M=n=>F((+n||0).toLocaleString('en-US',{maximumFractionDigits:2}));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const O=['','یک','دو','سه','چهار','پنج','شش','هفت','هشت','نه','ده','یازده','دوازده','سیزده','چهارده','پانزده','شانزده','هفده','هجده','نوزده'],T=['','','بیست','سی','چهل','پنجاه','شصت','هفتاد','هشتاد','نود'],H=['','صد','دویست','سیصد','چهارصد','پانصد','ششصد','هفتصد','هشتصد','نهصد'],SC=['','هزار','میلیون','میلیارد','تریلیون'];
function b1k(n){const p=[];if(n>=100)p.push(H[Math.floor(n/100)]);n%=100;if(n>=20){p.push(T[Math.floor(n/10)]);if(n%10)p.push(O[n%10])}else if(n)p.push(O[n]);return p.join(' و ')}
function words(n){n=Math.round(n);if(!n)return'صفر';const g=[];let i=0;while(n>0){const x=n%1000;if(x)g.unshift(b1k(x)+(SC[i]?' '+SC[i]:''));n=Math.floor(n/1000);i++}return g.join(' و ')}
const KEY='smart-invoice-v1';let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{p:[],c:[],inv:[],shop:{name:'',phone:'',addr:'',seller:''},no:1001,tpl:1};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const srt=(a,b)=>String(a.name).localeCompare(String(b.name),'fa');
const nrm=t=>String(t||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').toLowerCase();
if(!S.mig1){S.p=(S.p||[]).filter(p=>!(/^p[0-5]$/.test(p.id)&&['گل گاوزبان','بابونه شیرازی','آویشن کوهی','عرق نعنا دوآتشه','چوب دارچین','هل سبز'].includes(p.name)));S.mig1=1}
S.p.forEach(ensureStock);S.p.sort(srt);S.c.sort(srt);save();
let AE=null,CE=null,PQ='',CQ='',IQ='',FO={};let tab='new',PE=null,D={cid:'',cust:'',items:[],disc:0,pm:'نقدی'};
const uid=()=>Math.random().toString(36).slice(2,9);
function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:90px;left:16px;right:16px;margin:auto;max-width:420px;background:#2b3322;color:#fff;padding:12px 16px;border-radius:12px;z-index:99;text-align:center';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)}
function ask(m,fn){const a=document.createElement('div');a.id='askb';a.style.cssText='position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';a.innerHTML='<div class=card style="max-width:340px;margin:0"><p>'+esc(m)+'</p><div class=row><button id=ok>بله</button><button class=s id=no>انصراف</button></div></div>';document.body.appendChild(a);a.querySelector('#ok').onclick=()=>{a.remove();fn()};a.querySelector('#no').onclick=()=>a.remove()}
window.alert=m=>toast(m);window.confirm=()=>true;
const STK=m=>{toast('موجودی بعضی کالاها کافی نبود؛ موجودی آن‌ها صفر شد');return true};
const tot=d=>{const sub=d.items.reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0);const disc=Math.min(+d.disc||0,sub);return{sub,disc,pay:sub-disc}};
const today=()=>F(LG()=='fa'?new Date().toLocaleDateString('fa-IR-u-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'}):new Date().toLocaleDateString('en-CA'));
const SEG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 150"><path d="M30 0C18 38 42 76 30 150" fill="none" stroke="#6f8f4e" stroke-width="2"/><path d="M30 18C14 8 8 20 12 28C22 30 28 26 30 18Z" fill="#7da35a"/><path d="M31 46C46 36 54 46 50 54C40 58 33 54 31 46Z" fill="#5f8a3f"/><g transform="translate(18 92)"><circle r="5" fill="#e0a92b"/>${[0,45,90,135,180,225,270,315].map(a=>`<ellipse cx="0" cy="-9" rx="3.2" ry="5" fill="#fff" stroke="#d9cfae" stroke-width=".4" transform="rotate(${a})"/>`).join('')}</g><path d="M30 118C20 108 14 116 18 124C26 126 30 124 30 118Z" fill="#7da35a"/><g fill="#8b74c4"><ellipse cx="36" cy="126" rx="3" ry="4.5"/><ellipse cx="38" cy="135" rx="3" ry="4.5"/><ellipse cx="34" cy="143" rx="3" ry="4.5"/></g></svg>`;
const BG=`style="background-image:url('data:image/svg+xml,${encodeURIComponent(SEG)}')"`;
const LOGO=c=>`<svg viewBox="0 0 100 112" xmlns="http://www.w3.org/2000/svg" fill="${c}" stroke="${c}"><path d="M43 12C30 30 12 50 11 74C11 92 25 100 44 100C62 100 79 90 79 70C79 58 72 50 64 42" fill="none" stroke-width="3.2" stroke-linecap="round"/><path d="M43 10L68 44L60 46L40 20Z" stroke="none"/><path d="M67 12C77 20 77 34 67 44C59 34 59 20 67 12Z" stroke="none"/><path d="M68 43C74 38 81 39 83 42C79 47 72 47 68 45Z" stroke="none"/><text x="44" y="60" font-size="17" font-weight="700" text-anchor="middle" font-family="'Aref Ruqaa',Vazirmatn,serif" stroke="none">نور</text><text x="44" y="90" font-size="17" font-weight="700" text-anchor="middle" font-family="'Aref Ruqaa',Vazirmatn,serif" stroke="none">الشفاء</text></svg>`;
const LOGO2=t=>{const e=t==1?'#0b3d1b':'#e7c067';return `<svg viewBox="0 0 100 112" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f9e4f"/><stop offset="1" stop-color="#0a4a20"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9be06f"/><stop offset="1" stop-color="#1d8a3a"/></linearGradient></defs><path d="M43 8C28 28 9 49 9 74C9 94 25 106 46 106C67 106 83 92 83 72C83 56 73 47 64 40Z" fill="url(#gg)" stroke="${e}" stroke-width="2.6" stroke-linejoin="round"/><path d="M24 74C24 62 31 51 40 41" stroke="#fff" stroke-opacity=".28" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M68 4C83 15 83 34 68 46C55 34 55 15 68 4Z" fill="url(#gl)" stroke="${e}" stroke-width="1.6"/><path d="M68 11V42" stroke="#0a4a20" stroke-width="1.3" stroke-linecap="round"/><path d="M70 45C77 38 88 39 91 43C86 50 76 50 70 47Z" fill="url(#gl)" stroke="${e}" stroke-width="1.2"/><text x="45" y="62" font-size="21" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Aref Ruqaa',Vazirmatn,serif">نور</text><path d="M27 69H63" stroke="#fff" stroke-opacity=".55" stroke-width="1.2" stroke-linecap="round"/><text x="45" y="93" font-size="22" font-weight="700" text-anchor="middle" fill="#fff" font-family="'Aref Ruqaa',Vazirmatn,serif">الشفاء</text></svg>`};
function accts(){const s=S.shop;if(!s.accts){s.accts=(s.card||s.sheba)?[{id:uid(),label:'حساب اصلی',card:s.card||'',sheba:s.sheba||''}]:[]}return s.accts}

function acf(v){const a=v.acctData!==undefined?v.acctData:acctOf(v);return{card:a?a.card:'',sheba:a?a.sheba:''}}
function acctUI(){const e=AE?accts().find(a=>a.id==AE):null;return '<label>حساب های بانکی فروشنده</label>'+`<div class="g" style="margin-top:8px"><input id="a_l" value="${esc(e?e.label:'')}" placeholder="عنوان (مثلا بانک ملی)"><input id="a_c" inputmode="numeric" value="${esc(e?e.card:'')}" placeholder="شماره کارت"></div><input id="a_s" style="margin-top:8px" value="${esc(e?e.sheba:'')}" placeholder="شماره شبا IR..."><div class="row" style="margin-top:8px;align-items:center"><button class="s fit" onclick="addAcct()">${e?'ذخیره تغییرات':'ذخیره حساب جدید'}</button><span style="color:var(--mut);font-size:14px">اطلاعات فقط روی همین دستگاه ذخیره می‌شود.</span></div><div style="margin-top:12px">`+accts().map(a=>`<div class="li"><div>${esc(a.label)}<small>${esc(a.card)} ${esc(a.sheba)}</small></div><div class="row fit"><button class="s" onclick="AE='${a.id}';render();$('#a_l').scrollIntoView({block:'center'})">ویرایش</button><button class="d" onclick="ask('این حساب حذف شود؟',()=>{S.shop.accts=accts().filter(x=>x.id!='${a.id}');save();render()})">حذف</button></div></div>`).join('')+'</div>'}
function addAcct(){const l=$('#a_l').value.trim(),c=$('#a_c').value.trim(),s=$('#a_s').value.trim();if(!c&&!s)return toast('شماره کارت یا شبا را وارد کنید');const e=AE?accts().find(a=>a.id==AE):null;if(e){e.label=l||'حساب';e.card=c;e.sheba=s}else accts().push({id:uid(),label:l||'حساب',card:c,sheba:s});AE=null;save();render()}

${LG()=='fa'&&c.mode!='cr'?`<div class="words">(با حروف: ${words(c.amount)} تومان)</div>`:''}${d.note?`<div class="pi">توضیحات: ${esc(d.note)}</div>`:''}${(ac&&(ac.card||ac.sheba))?`<div class="pi"><b>اطلاعات پرداخت</b>${ac.card?`<div>شماره کارت: <bdi>${F(esc(ac.card))}</bdi></div>`:''}${ac.sheba?`<div>شماره شبا: <bdi>${F(esc(ac.sheba))}</bdi></div>`:''}${sh.seller?`<div>به نام: ${esc(sh.seller)}</div>`:''}</div>`:''}
<div class="thx">از انتخاب شما سپاسگزاریم. تندرستی، بزرگ‌ترین نعمت است.</div>
<div class="thx2">با کمال تشکر و احترام${sh.seller?' — '+esc(sh.seller):''}</div><div class="ft"><span>مهر و امضای فروشنده</span><span>امضای خریدار</span></div>

const TX={};TXR.forEach(r=>{const a=r.split('|');TX[a[0]]={ar:a[1],ur:a[2],en:a[3],zh:a[4]}});
const KEYS=Object.keys(TX).sort((a,b)=>b.length-a.length);
const isL=c=>!!c&&/[\u0600-\u065F\u066E-\u06EF\u06FA-\u06FF]/.test(c);
function rw(s,k,v){let o='',i=0,j;while((j=s.indexOf(k,i))>=0){const e=j+k.length;if(isL(s[j-1])||isL(s[e])){o+=s.slice(i,j+1);i=j+1}else{o+=s.slice(i,j)+v;i=e}}return o+s.slice(i)}
function tr(s){const l=LG();s=String(s);if(l=='fa'||!/[\u0600-\u06FF]/.test(s))return s;for(const k of KEYS)if(s.includes(k))s=rw(s,k,TX[k][l]);return s}
function applyLang(root){if(LG()=='fa'||!root)return;if(root.nodeType==3){const r=tr(root.nodeValue);if(r!==root.nodeValue)root.nodeValue=r;return}
const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>(/^(SCRIPT|STYLE)$/.test(n.parentNode.nodeName)||(n.parentNode.closest&&n.parentNode.closest('[data-nt]')))?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});const ns=[];while(w.nextNode())ns.push(w.currentNode);ns.forEach(n=>{const r=tr(n.nodeValue);if(r!==n.nodeValue)n.nodeValue=r});
const els=[root,...(root.querySelectorAll?root.querySelectorAll('[placeholder],[title]'):[])];els.forEach(e=>{['placeholder','title'].forEach(a=>{const v=e.getAttribute&&e.getAttribute(a);if(v){const r=tr(v);if(r!==v)e.setAttribute(a,r)}})})}
new MutationObserver(ms=>{if(LG()=='fa')return;ms.forEach(m=>m.addedNodes.forEach(n=>applyLang(n)))}).observe(document.body,{childList:true,subtree:true});

function cyr(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 'c'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16)}
const hasSub=()=>!!(window.crypto&&crypto.subtle);
async function shaOf(s){try{if(hasSub()){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return 's'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}return cyr(s)}
async function shaCheck(s,h){if(!h)return false;if(h[0]=='c')return cyr(s)===h;if(!hasSub())return true;return (await shaOf(s))===h}

let d;try{d=JSON.parse(o.payload)}catch(e){return{err:'فایل پشتیبان خراب یا ناقص است'}}
