<path d="M122 78 L448 84 L412 424 Q409 446 388 446 L86 446 Q64 446 68 424 Z" fill="url(#paper)" stroke="#e2b53c" stroke-width="6" stroke-linejoin="round"/>
<path d="M62 428 L392 428 Q430 430 418 462 Q408 478 378 472 L92 468 Q58 466 62 428 Z" fill="#f7efd9" stroke="#e2b53c" stroke-width="6" stroke-linejoin="round"/>
