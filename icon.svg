<path d="M176 148 Q256 164 336 148 L342 122 Q256 138 170 122 Z" fill="url(#goldH)" stroke="#a9741a" stroke-width="2"/>
<path d="M170 124 L158 66 L196 100 L207 52 L232 94 L256 40 L280 94 L305 52 L316 100 L354 66 L342 124 Q256 140 170 124 Z" fill="url(#goldH)" stroke="#a9741a" stroke-width="2" stroke-linejoin="round"/>
