<g fill="#ffe9a3" stroke="#a9741a" stroke-width="1"><circle cx="196" cy="137" r="3.5"/><circle cx="226" cy="142" r="3.5"/><circle cx="256" cy="144" r="3.5"/><circle cx="286" cy="142" r="3.5"/><circle cx="316" cy="137" r="3.5"/></g>
